name: frontend-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the immutable SHA image through the production SSH command"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.17.1
  PNPM_VERSION: 10.11.0
  NEXT_PUBLIC_API_URL: https://api.intly.tech/api/v1
  NEXT_PUBLIC_APP_ENV: production
  NEXT_PUBLIC_ENABLE_MSW: "false"

jobs:
  verify:
    name: Install, test, build, and validate image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Compute immutable image ref
        id: image-meta
        run: echo "image_ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Vitest
        run: pnpm exec vitest run

      - name: Build Next.js
        run: pnpm build

      - name: Verify delivery contract
        run: node scripts/verify-frontend-delivery-contract.mjs

      - name: Validate Compose config
        env:
          INTLY_FRONTEND_ENV_FILE: .env.production.example
          INTLY_FRONTEND_IMAGE: ghcr.io/example/intly-frontend:sha-0123456789abcdef0123456789abcdef01234567
        run: docker compose --env-file "$INTLY_FRONTEND_ENV_FILE" -f compose.yaml config --quiet

      - name: Setup Docker Buildx for image validation
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.deploy != true)
        uses: docker/setup-buildx-action@v4

      - name: Build immutable Docker image
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.deploy != true)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ steps.image-meta.outputs.image_ref }}
          cache-from: type=gha,scope=intly-frontend
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_ENV=${{ env.NEXT_PUBLIC_APP_ENV }}
            NEXT_PUBLIC_ENABLE_MSW=${{ env.NEXT_PUBLIC_ENABLE_MSW }}

  publish-image:
    name: Publish immutable frontend image
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image-meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute immutable image ref
        id: image-meta
        run: echo "image_ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish immutable Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image-meta.outputs.image_ref }}
          cache-from: type=gha,scope=intly-frontend
          cache-to: type=gha,mode=max,scope=intly-frontend
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_ENV=${{ env.NEXT_PUBLIC_APP_ENV }}
            NEXT_PUBLIC_ENABLE_MSW=${{ env.NEXT_PUBLIC_ENABLE_MSW }}

  deploy:
    name: Deploy production frontend
    needs: publish-image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key and known hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/intly-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/intly-ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/intly-ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/intly-ssh/known_hosts"

      - name: Deploy over restricted SSH command
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/intly-frontend-${GITHUB_SHA}.tar"
          git archive --format=tar --output="$tarball" HEAD
          cleanup() {
            rm -f "$tarball" "$RUNNER_TEMP/intly-ssh/deploy_key" "$RUNNER_TEMP/intly-ssh/known_hosts"
          }
          trap cleanup EXIT
          {
            printf '%s\n' "$GHCR_TOKEN"
            cat "$tarball"
          } | ssh -T \
            -i "$RUNNER_TEMP/intly-ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/intly-ssh/known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy ${GITHUB_SHA}"
